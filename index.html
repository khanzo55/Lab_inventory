<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمایشگاه</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root {
  --blue: #8bbce9;
  --blue-light: #eaf4ff;
  --dark: #26374a;
  --muted: #8493a3;
  --red: #e65b65;
  --bg: #f5f8fc;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  font-family: 'Vazirmatn', sans-serif;
  color: var(--dark);
  min-height: 100vh;
  padding-bottom: 115px;
}

header {
  margin: 18px 18px 25px;
  height: 105px;
  border-radius: 24px;
  background: linear-gradient(120deg, #e4f1ff, #d4e8fb);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 7px 22px rgba(90,140,190,.10);
}

header h1 {
  color: #6599cc;
  font-size: 29px;
  font-weight: 800;
  margin: 0;
  letter-spacing: 1px;
}

.top-tools {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0 22px 20px;
}

.search {
  width: 75%;
  max-width: 420px;
  border: 1px solid #e3eaf2;
  background: white;
  border-radius: 13px;
  padding: 12px 15px;
  outline: none;
  font-family: inherit;
  font-size: 13px;
  transition: .25s;
}

.search:focus {
  border-color: #8bbce9;
  box-shadow: 0 0 0 3px rgba(139,188,233,.13);
}

.menu-wrap {
  position: relative;
}

.menu-btn {
  width: 42px;
  height: 42px;
  background: white;
  border: 1px solid #e6edf4;
  border-radius: 13px;
  font-size: 22px;
  cursor: pointer;
  color: #60758b;
}

.menu {
  display: none;
  position: absolute;
  left: 0;
  top: 49px;
  width: 190px;
  background: white;
  border: 1px solid #edf0f4;
  border-radius: 13px;
  box-shadow: 0 10px 30px rgba(30,50,80,.13);
  z-index: 10;
  overflow: hidden;
  animation: appear .2s ease;
}

.menu.show {
  display: block;
}

.menu button {
  width: 100%;
  border: none;
  background: white;
  padding: 12px 14px;
  text-align: right;
  font-family: inherit;
  font-size: 11px;
  color: #46586b;
  cursor: pointer;
  transition: .2s;
}

.menu button:hover {
  background: #f0f6fd;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
  gap: 15px;
  padding: 0 20px;
}

.item {
  min-height: 125px;
  background: white;
  border: 1px solid #e8eef5;
  border-radius: 19px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  cursor: pointer;
  position: relative;
  padding: 12px 8px;
  box-shadow: 0 4px 13px rgba(35,65,95,.035);
  transition: background .25s, border .25s, transform .25s, box-shadow .25s;
  animation: appear .3s ease;
  overflow-wrap: anywhere;
}

.item:hover {
  background: var(--blue-light);
  border-color: #b9d9f7;
  transform: translateY(-4px);
  box-shadow: 0 9px 20px rgba(90,150,210,.13);
}

.item .name {
  font-size: 13px;
  font-weight: 600;
  text-align: center;
}

.item .amount {
  font-size: 11px;
  color: var(--muted);
}

.item.selected {
  background: #e94f5b;
  border-color: #e94f5b;
  color: white;
  transform: scale(.97);
}

.item.selected .amount {
  color: white;
}

.item.selected::after {
  content: "✓";
  position: absolute;
  top: 8px;
  left: 10px;
  font-size: 15px;
  font-weight: bold;
}

.item.locked {
  cursor: default;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  color: #9aa8b7;
  padding: 50px 10px;
  font-size: 13px;
}

.add-area {
  position: fixed;
  bottom: 19px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  z-index: 5;
  pointer-events: none;
}

.add-btn {
  pointer-events: auto;
  width: 75px;
  height: 55px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #91c3ef, #6ca9df);
  color: white;
  font-size: 34px;
  font-weight: 400;
  cursor: pointer;
  box-shadow: 0 7px 20px rgba(85,150,210,.3);
  transition: .25s;
}

.add-btn:hover {
  transform: translateY(-4px) scale(1.05);
  box-shadow: 0 10px 25px rgba(85,150,210,.4);
}
